[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-llm"
version = "2.0.0"
description = "Two LLM agents discuss a question and reach a consensus answer via Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "itfx3035" }]
keywords = ["ollama", "llm", "agents", "debate", "consensus"]
dependencies = [
    "langchain-ollama>=0.2,<0.4",
    "langchain-core>=0.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
twin-llm = "main:main"

[tool.setuptools]
py-modules = ["twin_lib", "main"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "D"]
ignore = ["D203", "D212", "D404"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"examples/*" = ["D", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
